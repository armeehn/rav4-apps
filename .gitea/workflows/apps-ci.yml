# Builds all 26 standalone apps and proves each one can still read the launcher palette.
#
# There is no Gradle here on purpose (see ROADMAP 0.1): every app is a handful of
# framework-only Java files, and template/build.sh takes ~2.5 s per app, so the whole
# suite builds in about a minute.
name: apps-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: apps-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # build.sh needs a real JDK 17: d8 from build-tools 34 crashes on class files
      # from a newer JDK even with --release 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The SDK is bind-mounted read-only into the job container by the runner, with
      # ANDROID_HOME set through its config. build.sh reads ANDROID_SDK_ROOT.
      - name: Build every app
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          [ -d "$ANDROID_SDK_ROOT" ] || { echo "no Android SDK on this runner"; exit 1; }

          failed=""
          for d in apps/com.reveng.*; do
            if ! template/build.sh "$d" >"/tmp/$(basename "$d").log" 2>&1; then
              failed="$failed $(basename "$d")"
              echo "::group::FAILED $(basename "$d")"
              tail -30 "/tmp/$(basename "$d").log"
              echo "::endgroup::"
            fi
          done
          [ -z "$failed" ] || { echo "failed:$failed"; exit 1; }
          echo "built $(ls -d apps/com.reveng.* | wc -l) apps"

      # A missing <queries> entry does not fail a build, does not log anything at
      # build time, and leaves the app silently unthemed on the panel.
      - name: Theme wiring
        run: scope/check-theme-wiring.sh
